version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      automation-engines:
        patterns: ["playwright*", "selenium*", "pywinauto*", "appium*", "zeep*", "httpx*", "requests*", "lxml*"]
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "pip-audit", "pre-commit", "mutmut"]
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
