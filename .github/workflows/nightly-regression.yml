name: nightly-regression

on:
  schedule:
    - cron: "11 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-web:
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      matrix:
        browser: [primary, secondary]   # map to real browsers once ADR D-01 is decided
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Regression twice + flaky detection
        env:
          TAF_ENV: test
          TAF_BROWSER: ${{ matrix.browser }}
        run: |

          set +e
          failed=0
          for run in 1 2; do
            uv run --no-sync pytest -m "regression and (api or web) and not quarantine" -n auto --junitxml=reports/run$run.xml
            code=$?
            if [ "$code" = "5" ]; then echo "::warning::No API/web regression tests yet."; exit 0; fi
            if [ "$code" != "0" ]; then failed=1; fi
          done
          uv run --no-sync python scripts/flaky_report.py reports/run1.xml reports/run2.xml --out reports/flaky.json --fail-on-flaky || failed=1
          exit $failed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-api-web-${{ matrix.browser }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  desktop:
    runs-on: windows-latest   # replace with the self-hosted interactive Windows runner
    environment: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Desktop regression twice + flaky detection
        shell: bash
        env:
          TAF_ENV: test
        run: |

          set +e
          failed=0
          for run in 1 2; do
            uv run --no-sync pytest -m "regression and desktop and not quarantine" -p no:xdist --junitxml=reports/run$run.xml
            code=$?
            if [ "$code" = "5" ]; then echo "::warning::No desktop regression tests yet."; exit 0; fi
            if [ "$code" != "0" ]; then failed=1; fi
          done
          uv run --no-sync python scripts/flaky_report.py reports/run1.xml reports/run2.xml --out reports/flaky.json --fail-on-flaky || failed=1
          exit $failed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-desktop
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  quarantined:
    # Non-gating: verifies fixes for quarantined tests so they can leave quarantine.
    runs-on: ubuntu-latest
    environment: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -m "quarantine and not desktop" --junitxml=reports/quarantine.xml || true
